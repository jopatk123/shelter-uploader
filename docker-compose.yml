version: '3.8'

services:
  uploader:
    build: .
    container_name: shelter-uploader
    restart: unless-stopped
    ports:
      - '15000:3001'
    environment:
      - PORT=3001
      # 必填：未在 .env 配置时直接报错，避免用默认凭据启动
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD 未配置：请先复制 .env.example 为 .env 并设置}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET 未配置：请先复制 .env.example 为 .env 并设置}
      - CHUNK_SIZE=${CHUNK_SIZE:-5}
      - VIDEO_MAX_SIZE_MB=${VIDEO_MAX_SIZE_MB:-100}
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    # 适配低配服务器，限制资源
    deploy:
      resources:
        limits:
          memory: 512M
