name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test -- --reporter=default
        env:
          NODE_ENV: test
          ADMIN_PASSWORD: '123456'
          JWT_SECRET: 'test-secret'

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: shelter-uploader:ci
          load: true

      - name: Smoke test container
        run: |
          docker run -d --name shelter-uploader-ci -p 15000:3001 \
            -e ADMIN_PASSWORD=ci-password \
            -e JWT_SECRET=ci-secret \
            shelter-uploader:ci
          sleep 5
          curl -fsS http://127.0.0.1:15000/api/health | grep -q '"success":true'
          docker rm -f shelter-uploader-ci

      - name: Verify missing credentials block startup
        run: |
          # 仅给 ADMIN_PASSWORD、缺少 JWT_SECRET 时必须启动失败（退出码非 0 且非超时）
          set +e
          timeout 15 docker run --rm -e ADMIN_PASSWORD=ci-password shelter-uploader:ci >/dev/null 2>&1
          code=$?
          set -e
          if [ "$code" -eq 0 ] || [ "$code" -eq 124 ]; then
            echo "缺少 JWT_SECRET 时容器未按预期阻断启动（退出码 $code）" >&2
            exit 1
          fi
          echo "缺少必需环境变量时已按预期阻断启动"
